<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'self'">
  <title>StoryCardWriter LITE</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <div class="toolbar" aria-label="ファイル操作">
      <button id="new-button" type="button">新規</button>
      <button id="open-button" type="button">開く</button>
      <button id="save-button" type="button">保存</button>
      <button id="save-as-button" type="button">名前を付けて保存</button>
      <span class="share-space" aria-label="共有ボタン用の場所">
        <button type="button" disabled title="今回は未実装です">共有</button>
      </span>
    </div>
    <div class="title-area">
      <h1 id="work-heading">無題の作品</h1>
      <p id="file-status">新しい作品</p>
    </div>
  </header>

  <main>
    <section class="settings-panel" aria-labelledby="settings-heading">
      <h2 id="settings-heading">作品・人物名</h2>
      <div class="settings-fields">
        <label>作品名<input id="title-input" type="text" autocomplete="off"></label>
        <label>主人公名<input id="protagonist-input" type="text" autocomplete="off" placeholder="主人公"></label>
        <label>相手役名<input id="partner-input" type="text" autocomplete="off" placeholder="相手役"></label>
      </div>
    </section>

    <section class="cards-section" aria-labelledby="cards-heading">
      <h2 id="cards-heading">カード</h2>
      <p id="empty-message" class="empty-message">下の入力欄から、思いついた瞬間を1枚のカードとして残せます。</p>
      <div id="card-list" class="card-list" aria-live="polite"></div>
    </section>

    <section id="editor-panel" class="editor-panel" aria-labelledby="editor-heading">
      <div class="editor-heading-row">
        <div>
          <h2 id="editor-heading">カード追加</h2>
          <p id="editor-mode-note">カードの種類と文章を入力してください。</p>
        </div>
        <button id="cancel-edit-button" class="secondary hidden" type="button">キャンセル</button>
      </div>
      <fieldset>
        <legend>種類</legend>
        <div id="type-buttons" class="type-buttons"></div>
      </fieldset>
      <label class="body-label" for="card-body">文章</label>
      <textarea id="card-body" rows="4" placeholder="主人公を入力"></textarea>
      <div class="editor-actions">
        <button id="submit-card-button" class="primary" type="button">追加</button>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="document-codec.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
